services:
  - type: web
    name: personaforge-whatsapp-gateway
    runtime: docker
    dockerfilePath: ./services/whatsapp-gateway/Dockerfile
    dockerContext: ./services/whatsapp-gateway
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_SANDBOX_KEYWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PLATFORM_URL
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: PHONE_HASH_SALT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
