name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test Core
        run: pnpm --filter "@personaforge/core" test

  whatsapp-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/whatsapp-gateway/requirements.txt

      - name: Lint with ruff
        run: |
          ruff check services/whatsapp-gateway/

      - name: Test with pytest
        run: |
          cd services/whatsapp-gateway
          pytest -v
